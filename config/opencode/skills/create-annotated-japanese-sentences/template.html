<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
	:root {
		color-scheme: dark;
		--bg: #121212;
		--fg: #e0e0e0;
		--muted: #9e9e9e;
		--border: #333;
		--header-bg: #1e1e1e;
		--noun: #64a0ff;
		--verb: #ef5350;
		--adjective: #66bb6a;
		--adverb: #26c6da;
		--particle: #9e9e9e;
		--auxiliary: #ffa726;
		--pronoun: #ba68c8;
		--conjunction: #a1887f;
		--counter: #4db6ac;
		--interjection: #f06292;
		--affix: #d4c03a;
		--adnominal: #aed581;
	}
	body {
		font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
		max-width: 960px;
		margin: 2rem auto;
		padding: 0 1rem;
		background: var(--bg);
		color: var(--fg);
		line-height: 1.5;
	}
	h1 { font-size: 1.6rem; }
	.legend {
		display: flex;
		flex-wrap: wrap;
		gap: 0.5rem;
		padding: 0.75rem;
		border: 1px solid var(--border);
		border-radius: 6px;
		margin-bottom: 2rem;
	}
	.badge {
		display: inline-block;
		padding: 0.1rem 0.5rem;
		border-radius: 4px;
		color: var(--bg);
		font-size: 0.8rem;
		white-space: nowrap;
	}
	.sentence {
		border-top: 2px solid var(--border);
		padding-top: 1rem;
		margin-bottom: 2.5rem;
		page-break-inside: avoid;
	}
	h2.section { font-size: 1.3rem; color: var(--fg); border-bottom: 3px solid var(--noun); padding-bottom: 0.3rem; margin-top: 3rem; }
	.sentence h2 { font-size: 1rem; color: var(--muted); margin: 0 0 0.5rem; }
	.full {
		font-size: 2rem;
		line-height: 2.6;
		margin: 0.5rem 0 1rem;
	}
	.full a { color: inherit; text-decoration: none; cursor: pointer; border-bottom: 2px solid currentColor; margin: 0 1px; }
	ruby rt { font-size: 0.45em; color: #aaa; }
	table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
	th, td { border: 1px solid var(--border); padding: 0.35rem 0.6rem; text-align: left; vertical-align: middle; }
	th { background: var(--header-bg); }
	td.word { font-size: 1.3rem; }
	.translation { font-style: italic; margin-top: 1rem; font-size: 1.1rem; }
	.uncertain::after { content: " ?"; color: #ff6b6b; font-weight: bold; }

	.noun { color: var(--noun); }
	.verb { color: var(--verb); }
	.adjective { color: var(--adjective); }
	.adverb { color: var(--adverb); }
	.particle { color: var(--particle); }
	.auxiliary { color: var(--auxiliary); }
	.pronoun { color: var(--pronoun); }
	.conjunction { color: var(--conjunction); }
	.counter { color: var(--counter); }
	.interjection { color: var(--interjection); }
	.affix { color: var(--affix); }
	.adnominal { color: var(--adnominal); }

	.badge.noun { background: var(--noun); color: var(--bg); }
	.badge.verb { background: var(--verb); color: var(--bg); }
	.badge.adjective { background: var(--adjective); color: var(--bg); }
	.badge.adverb { background: var(--adverb); color: var(--bg); }
	.badge.particle { background: var(--particle); color: var(--bg); }
	.badge.auxiliary { background: var(--auxiliary); color: var(--bg); }
	.badge.pronoun { background: var(--pronoun); color: var(--bg); }
	.badge.conjunction { background: var(--conjunction); color: var(--bg); }
	.badge.counter { background: var(--counter); color: var(--bg); }
	.badge.interjection { background: var(--interjection); color: var(--bg); }
	.badge.affix { background: var(--affix); color: var(--bg); }
	.badge.adnominal { background: var(--adnominal); color: var(--bg); }

	.say {
		font: inherit; font-size: 0.85rem;
		border: 1px solid var(--border); background: var(--header-bg); color: var(--fg);
		border-radius: 999px; padding: 0.1rem 0.55rem; margin-left: 0.4rem;
		cursor: pointer; vertical-align: middle;
	}
	.say:hover { border-color: var(--muted); }
	.say.playing { border-color: var(--noun); color: var(--noun); }
	.say-note { font-size: 0.9rem; color: var(--muted); }

	@media print {
		body { margin: 0; max-width: none; background: #fff; color: #222; }
		.full span[title] { border-bottom: none; }
		.say, .say-note { display: none !important; }
	}
</style>
</head>
<body>
<h1>{{TITLE}}</h1>
<p class="say-note">Press 🔊 to hear each sentence (🐢 plays it slowly).</p>

<div class="legend">
	<span class="badge noun">Noun</span>
	<span class="badge verb">Verb</span>
	<span class="badge adjective">Adjective (い / な)</span>
	<span class="badge adverb">Adverb</span>
	<span class="badge particle">Particle</span>
	<span class="badge auxiliary">Auxiliary / Copula</span>
	<span class="badge pronoun">Pronoun</span>
	<span class="badge conjunction">Conjunction</span>
	<span class="badge counter">Counter / Number</span>
	<span class="badge interjection">Interjection</span>
	<span class="badge affix">Prefix / Suffix</span>
	<span class="badge adnominal">Adnominal (ある, そんな…)</span>
</div>

<!-- SENTENCES -->

<script>
/* Reads each sentence aloud with the browser's built-in speech (ja-JP voice,
   Kyoko on macOS when present). Adds a 🔊 and a slow 🐢 button to the
   heading of every section.sentence, speaking its .full text without furigana. */
(function () {
	var voice = null;

	function pickVoice() {
		var voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
		var ja = voices.filter(function (v) { return /^ja(-|_|$)/i.test(v.lang); });
		voice = ja.filter(function (v) { return /kyoko/i.test(v.name); })[0] || ja[0] || null;
	}

	function say(text, rate, btn) {
		if (!window.speechSynthesis) {
			alert('This browser has no speech synthesis. Try Safari or Chrome.');
			return;
		}
		speechSynthesis.cancel();
		var u = new SpeechSynthesisUtterance(text);
		u.lang = 'ja-JP';
		if (voice) u.voice = voice;
		u.rate = rate;
		btn.classList.add('playing');
		u.onend = u.onerror = function () { btn.classList.remove('playing'); };
		speechSynthesis.speak(u);
	}

	function button(label, aria, text, rate) {
		var b = document.createElement('button');
		b.className = 'say';
		b.type = 'button';
		b.textContent = label;
		b.setAttribute('aria-label', aria);
		b.addEventListener('click', function () { say(text, rate, b); });
		return b;
	}

	function init() {
		pickVoice();
		if (window.speechSynthesis) speechSynthesis.onvoiceschanged = pickVoice;
		document.querySelectorAll('section.sentence').forEach(function (sec) {
			var full = sec.querySelector('.full');
			var h2 = sec.querySelector('h2');
			if (!full || !h2) return;
			var copy = full.cloneNode(true);
			copy.querySelectorAll('rt, rp').forEach(function (e) { e.remove(); });
			var text = copy.textContent.replace(/\s+/g, '');
			if (!text) return;
			h2.appendChild(button('🔊', 'Play sentence', text, 1));
			h2.appendChild(button('🐢', 'Play sentence slowly', text, 0.6));
		});
	}

	if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
	else init();
})();
</script>
</body>
</html>
