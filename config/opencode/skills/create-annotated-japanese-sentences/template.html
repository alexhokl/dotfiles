<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
	:root {
		--noun: #1f5fbf;
		--verb: #c62828;
		--adjective: #2e7d32;
		--adverb: #00838f;
		--particle: #757575;
		--auxiliary: #ef6c00;
		--pronoun: #6a1b9a;
		--conjunction: #6d4c41;
		--counter: #00796b;
		--interjection: #d81b60;
		--affix: #9e8600;
		--adnominal: #7cb342;
	}
	body {
		font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
		max-width: 960px;
		margin: 2rem auto;
		padding: 0 1rem;
		color: #222;
		line-height: 1.5;
	}
	h1 { font-size: 1.6rem; }
	.legend {
		display: flex;
		flex-wrap: wrap;
		gap: 0.5rem;
		padding: 0.75rem;
		border: 1px solid #ddd;
		border-radius: 6px;
		margin-bottom: 2rem;
	}
	.badge {
		display: inline-block;
		padding: 0.1rem 0.5rem;
		border-radius: 4px;
		color: #fff;
		font-size: 0.8rem;
		white-space: nowrap;
	}
	.sentence {
		border-top: 2px solid #eee;
		padding-top: 1rem;
		margin-bottom: 2.5rem;
		page-break-inside: avoid;
	}
	h2.section { font-size: 1.3rem; color: #333; border-bottom: 3px solid #1f5fbf; padding-bottom: 0.3rem; margin-top: 3rem; }
	.sentence h2 { font-size: 1rem; color: #888; margin: 0 0 0.5rem; }
	.full {
		font-size: 2rem;
		line-height: 2.6;
		margin: 0.5rem 0 1rem;
	}
	.full a { color: inherit; text-decoration: none; cursor: pointer; border-bottom: 2px solid currentColor; margin: 0 1px; }
	ruby rt { font-size: 0.45em; color: #555; }
	table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
	th, td { border: 1px solid #ddd; padding: 0.35rem 0.6rem; text-align: left; vertical-align: middle; }
	th { background: #f6f6f6; }
	td.word { font-size: 1.3rem; }
	.translation { font-style: italic; margin-top: 1rem; font-size: 1.1rem; }
	.uncertain::after { content: " ?"; color: #c00; font-weight: bold; }

	.noun { color: var(--noun); }
	.verb { color: var(--verb); }
	.adjective { color: var(--adjective); }
	.adverb { color: var(--adverb); }
	.particle { color: var(--particle); }
	.auxiliary { color: var(--auxiliary); }
	.pronoun { color: var(--pronoun); }
	.conjunction { color: var(--conjunction); }
	.counter { color: var(--counter); }
	.interjection { color: var(--interjection); }
	.affix { color: var(--affix); }
	.adnominal { color: var(--adnominal); }

	.badge.noun { background: var(--noun); color: #fff; }
	.badge.verb { background: var(--verb); color: #fff; }
	.badge.adjective { background: var(--adjective); color: #fff; }
	.badge.adverb { background: var(--adverb); color: #fff; }
	.badge.particle { background: var(--particle); color: #fff; }
	.badge.auxiliary { background: var(--auxiliary); color: #fff; }
	.badge.pronoun { background: var(--pronoun); color: #fff; }
	.badge.conjunction { background: var(--conjunction); color: #fff; }
	.badge.counter { background: var(--counter); color: #fff; }
	.badge.interjection { background: var(--interjection); color: #fff; }
	.badge.affix { background: var(--affix); color: #fff; }
	.badge.adnominal { background: var(--adnominal); color: #fff; }

	@media print {
		body { margin: 0; max-width: none; }
		.full span[title] { border-bottom: none; }
	}
</style>
</head>
<body>
<h1>{{TITLE}}</h1>

<div class="legend">
	<span class="badge noun">Noun</span>
	<span class="badge verb">Verb</span>
	<span class="badge adjective">Adjective (い / な)</span>
	<span class="badge adverb">Adverb</span>
	<span class="badge particle">Particle</span>
	<span class="badge auxiliary">Auxiliary / Copula</span>
	<span class="badge pronoun">Pronoun</span>
	<span class="badge conjunction">Conjunction</span>
	<span class="badge counter">Counter / Number</span>
	<span class="badge interjection">Interjection</span>
	<span class="badge affix">Prefix / Suffix</span>
	<span class="badge adnominal">Adnominal (ある, そんな…)</span>
</div>

<!-- SENTENCES -->

</body>
</html>
